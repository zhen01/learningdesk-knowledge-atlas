  <text x="47" y="104" font-family="Georgia,serif" font-size="46" fill="#f4f6ef">Make what you read connect.</text>
  <text x="49" y="138" font-size="17" fill="#bacfc1">Local documents → incremental AI indexing → a lasting, source-linked knowledge graph.</text>
