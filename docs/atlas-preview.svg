<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">LearningDesk — turn reading into a connected atlas</title><desc id="desc">Illustrated interface with a knowledge tree, related concepts and a source-linked reading highlight. All examples are synthetic.</desc>
